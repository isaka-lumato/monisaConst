    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template with date
    sortable_fields: ["date", "title", "published"]
    view_filters:
      - label: "Published"
        field: published
        pattern: true
      - label: "Drafts"
        field: published
        pattern: false
    view_groups:
      - label: "Year"
        field: date
        pattern: \d{4}
      - label: "Status"
        field: published
    fields: # The fields for each document
      - {
          label: "Title",
          name: "title",
          widget: "string",
          required: true,
          hint: "The main title of the blog post",
        }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          required: true,
          default: "{{now}}",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          format: "YYYY-MM-DD HH:mm",
          hint: "When this post should be published",
        }
      - {
          label: "Author",
          name: "author",
          widget: "select",
          required: true,
          options:
            [
              "John Mwalimu",
              "Sarah Hassan",
              "Michael Kimani",
              "Grace Mwangi",
              "David Ochieng",
