          name: "featuredImage",
          widget: "image",
          required: true,
          hint: "Main image for the blog post (recommended: 1200x630px)",
        }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Add relevant tags to help categorize this post"
        field: { label: "Tag", name: "tag", widget: "string" }
        default: []
      - {
          label: "Published",
          name: "published",
          widget: "boolean",
          required: true,
          default: false,
          hint: "Toggle to publish this post on the website",
        }
      - {
          label: "SEO Title",
          name: "seoTitle",
          widget: "string",
          required: false,
          hint: "Custom title for search engines (leave empty to use main title)",
        }
      - {
          label: "SEO Description",
          name: "seoDescription",
          widget: "text",
          required: false,
          hint: "Custom description for search engines (leave empty to use excerpt)",
        }
      - {
          label: "Content",
          name: "body",
          widget: "markdown",
          required: true,
          hint: "The main content of your blog post. Use markdown for formatting.",
        }

