name: Build and Deploy CMS Content

on:
  push:
    branches: [main, master]
    paths:
      - "content/**"
      - "admin/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main, master]
    paths:
      - "content/**"
      - "admin/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force complete rebuild"
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: "18"
  CACHE_VERSION: "v1"
  SKIP_MISSING_IMAGES: "true"

jobs:
  build:
    name: Build Content
    runs-on: ubuntu-latest

    outputs:
      build-success: ${{ steps.build-content.outcome == 'success' }}
      has-changes: ${{ steps.check-changes.outputs.has-changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit

      - name: Check for content changes
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Force rebuild requested"
          elif git diff --quiet HEAD~1 HEAD -- content/ admin/ scripts/ package.json package-lock.json; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "No relevant changes detected"
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Content or build script changes detected"
          fi

      - name: Validate content structure
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          echo "Validating content directory structure..."

          # Check required directories exist
          for dir in content/projects content/blog content/services content/team content/settings; do
            if [ ! -d "$dir" ]; then
              echo "❌ Required directory missing: $dir"
              exit 1
            fi
          done

          # Check for at least one content file in each collection
          for collection in projects blog services team; do
            if [ ! "$(find content/$collection -name '*.md' -not -name 'README.md' | head -1)" ]; then
              echo "⚠️ Warning: No content files found in $collection collection"
            fi
          done

          echo "✅ Content structure validation passed"

      - name: Run content validation
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          echo "Running content validation..."
          npm run validate:settings || echo "⚠️ Site settings validation failed"

      - name: Build content
        id: build-content
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          echo "Building content..."
          npm run build:content

      - name: Verify generated files
        if: steps.check-changes.outputs.has-changes == 'true' && steps.build-content.outcome == 'success'
        run: |
          echo "Verifying generated JSON files..."

          # Check that JSON files were generated
          for file in assets/data/projects.json assets/data/blog.json assets/data/services.json assets/data/team.json assets/data/site-settings.json; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing generated file: $file"
              exit 1
            fi
            
            # Validate JSON syntax
            if ! jq empty "$file" 2>/dev/null; then
              echo "❌ Invalid JSON in file: $file"
              exit 1
            fi
            
            echo "✅ Validated: $file"
          done

          echo "✅ All generated files verified"

      - name: Upload build artifacts
        if: steps.check-changes.outputs.has-changes == 'true' && steps.build-content.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: generated-content-${{ github.sha }}
          path: |
            assets/data/
            assets/uploads/
          retention-days: 30

      - name: Generate build summary
        if: always() && steps.check-changes.outputs.has-changes == 'true'
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.build-content.outcome }}" = "success" ]; then
            echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
            
            # Count generated items
            for collection in projects blog services team; do
              if [ -f "assets/data/${collection}.json" ]; then
                count=$(jq length "assets/data/${collection}.json" 2>/dev/null || echo "0")
                echo "- ${collection^}: $count items" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.build-success == 'true' && needs.build.outputs.has-changes == 'true'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-content-${{ github.sha }}
          path: ./

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Download build artifacts
        if: needs.build.outputs.build-success == 'true'
        uses: actions/download-artifact@v4
        with:
          name: generated-content-${{ github.sha }}
          path: ./

      - name: Prepare collections info
        if: needs.build.outputs.build-success == 'true'
        run: |
          node -e "const fs=require('fs');function c(p){try{return JSON.parse(fs.readFileSync(p,'utf8')).length}catch(e){return 0}};const info={projects:c('assets/data/projects.json'),blog:c('assets/data/blog.json'),services:c('assets/data/services.json'),team:c('assets/data/team.json')};fs.writeFileSync('collections_info.json', JSON.stringify(info));"
          echo "COLLECTIONS_INFO=$(cat collections_info.json)" >> $GITHUB_ENV

      - name: Notify on success (build)
        if: needs.build.outputs.build-success == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COLLECTIONS_INFO: ${{ env.COLLECTIONS_INFO }}
        run: |
          node scripts/deployment-notifications.js build-success

      - name: Notify on deployment success
        if: needs.build.outputs.build-success == 'true' && needs.deploy.result == 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOY_ENVIRONMENT: github-pages
        run: |
          node scripts/deployment-notifications.js deploy-success

      - name: Notify on failure
        if: needs.build.outputs.build-success != 'true' || needs.deploy.result == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_ERROR: Build or deployment failed
        run: |
          node scripts/deployment-notifications.js build-failure

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Find last successful deployment
        id: find-last-success
        run: |
          # Get the last successful workflow run
          LAST_SUCCESS=$(gh api repos/${{ github.repository }}/actions/workflows/build-and-deploy.yml/runs \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .head_sha' \
            | head -1)
            
          if [ -n "$LAST_SUCCESS" ]; then
            echo "last-success-sha=$LAST_SUCCESS" >> $GITHUB_OUTPUT
            echo "Found last successful deployment: $LAST_SUCCESS"
          else
            echo "No previous successful deployment found"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Revert to last successful state
        if: steps.find-last-success.outputs.last-success-sha
        run: |
          echo "Rolling back to commit: ${{ steps.find-last-success.outputs.last-success-sha }}"

          # Create a revert commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reset to last successful state
          git reset --hard ${{ steps.find-last-success.outputs.last-success-sha }}

          # Force push the rollback (be careful with this in production)
          # git push --force-with-lease origin main

          echo "⚠️ Rollback prepared. Manual intervention may be required."
          echo "Last successful commit: ${{ steps.find-last-success.outputs.last-success-sha }}"
