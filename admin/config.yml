backend:
  name: git-gateway
  branch: main
  squash_merges: true # Enable squash merges for cleaner history

# Media files will be stored in the repo under assets/uploads
media_folder: "assets/uploads"
# The src attribute for uploaded media will begin with /assets/uploads
public_folder: "/assets/uploads"

# Enhanced media library configuration with performance optimizations
media_library:
  name: uploadcare
  config:
    publicKey: "demopublickey"
    multiple: true
    tabs: "file camera url facebook gdrive gphotos dropbox instagram"
    effects: "crop,rotate,enhance,grayscale"
    imageShrink: "1920x1080" # Optimized for web performance
    previewStep: true
    clearable: true
    # Performance optimizations
    autostore: true # Automatically store files
    crop: "1920x1080" # Consistent sizing for performance
    quality: "smart" # Smart compression
    format: "auto" # Auto-select best format (WebP when supported)
    progressive: true # Progressive JPEG loading
    # Enhanced validation for performance
    validators:
      - name: "file-size"
        params:
          maxFileSize: 5242880 # 5MB for better performance
      - name: "image-size"
        params:
          minWidth: 100
          minHeight: 100
          maxWidth: 3840 # 4K max for performance
          maxHeight: 2160
    # Upload performance settings
    multipartMinSize: 26214400 # 25MB threshold for multipart uploads
    multipartChunkSize: 5242880 # 5MB chunks for better progress tracking
    parallelDirectUploads: 3 # Limit concurrent uploads for stability

# Alternative: Git-based media library (recommended for version control)
# media_library:
#   name: git
#   config:
#     repo: "your-repo-name"
#     branch: "main"

# Comprehensive media management configuration
media:
  # File size limits by type (in bytes)
  size_limits:
    image: 5242880 # 5MB for images
    document: 10485760 # 10MB for documents
    default: 2097152 # 2MB default

  # Allowed file extensions by category
  allowed_extensions:
    images: ["jpg", "jpeg", "png", "webp", "gif", "svg"]
    documents: ["pdf", "doc", "docx"]
    all: ["jpg", "jpeg", "png", "webp", "gif", "svg", "pdf", "doc", "docx"]

  # Image processing and optimization
  image_processing:
    auto_optimize: true
    max_dimensions:
      width: 1920
      height: 1080
    quality: 85
    generate_webp: true
    create_thumbnails: true
    thumbnail_sizes:
      - { width: 300, height: 200, suffix: "thumb" }
      - { width: 600, height: 400, suffix: "medium" }
      - { width: 1200, height: 800, suffix: "large" }

  # File validation rules
  validation:
    filename_pattern: "^[a-zA-Z0-9._-]+$"
    max_filename_length: 100
    min_image_dimensions:
      width: 100
      height: 100
    check_duplicates: true
    scan_content: true

  # Organized folder structure
  organization:
    auto_categorize: true
    folder_structure:
      projects:
        path: "projects"
        description: "Project images and documents"
        subfolders: ["gallery", "documents", "plans"]
        allowed_types: ["images", "documents"]
      blog:
        path: "blog"
        description: "Blog post media"
        subfolders: ["featured", "content"]
        allowed_types: ["images"]
      team:
        path: "team"
        description: "Team member photos"
        subfolders: ["headshots", "group"]
        allowed_types: ["images"]
      services:
        path: "services"
        description: "Service-related media"
        subfolders: ["icons", "brochures"]
        allowed_types: ["images", "documents"]
      general:
        path: "general"
        description: "General media files"
        subfolders: ["logos", "misc"]
        allowed_types: ["images", "documents"]
      documents:
        path: "documents"
        description: "Company documents"
        subfolders: ["contracts", "reports", "certificates"]
        allowed_types: ["documents"]

# Collections define the structure for the different content types
collections:
  - name: "projects" # Used in routes, e.g., /admin/collections/projects
    label: "Projects" # Used in the UI
    folder: "content/projects" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: "Title", name: "title", widget: "string", required: true }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          required: true,
          options:
            ["Residential", "Commercial", "Industrial", "Infrastructure"],
        }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          required: true,
          options: ["Planning", "In Progress", "Completed", "On Hold"],
        }
      - {
          label: "Location",
          name: "location",
          widget: "string",
          required: true,
        }
      - {
          label: "Completion Date",
          name: "completionDate",
          widget: "date",
          required: false,
          hint: "Leave empty for ongoing projects",
        }
      - {
          label: "Duration",
          name: "duration",
          widget: "string",
          required: false,
          hint: "e.g., '6 months' or '1 year'",
        }
      - {
          label: "Budget",
          name: "budget",
          widget: "string",
          required: false,
          hint: "e.g., '$500,000' or 'Contact for quote'",
        }
      - {
          label: "Short Description",
          name: "shortDescription",
          widget: "text",
          required: true,
          hint: "Brief description for project listings",
        }
      - label: "Images"
        name: "images"
        widget: "object"
        required: true
        fields:
          - {
              label: "Main Image",
              name: "main",
              widget: "image",
              required: true,
              hint: "Primary image for project showcase",
            }
          - label: "Gallery"
            name: "gallery"
            widget: "list"
            required: false
            hint: "Additional project images"
            field: { label: "Image", name: "image", widget: "image" }
      - label: "Specifications"
        name: "specifications"
        widget: "object"
        required: false
        hint: "Technical specifications for the project"
        fields:
          - {
              label: "Area",
              name: "area",
              widget: "string",
              required: false,
              hint: "e.g., '3,500 sq ft' or '500 sq m'",
            }
          - {
              label: "Bedrooms",
              name: "bedrooms",
              widget: "number",
              required: false,
              min: 0,
              max: 20,
              hint: "Number of bedrooms (for residential projects)",
            }
          - {
              label: "Bathrooms",
              name: "bathrooms",
              widget: "number",
              required: false,
              min: 0,
              max: 50,
              hint: "Number of bathrooms/restrooms",
            }
          - {
              label: "Floors",
              name: "floors",
              widget: "number",
              required: false,
              min: 1,
              max: 50,
              hint: "Number of floors/stories",
            }
          - label: "Materials"
            name: "materials"
            widget: "list"
            required: false
            hint: "Key construction materials used"
            field: { label: "Material", name: "material", widget: "string" }
      - label: "Features"
        name: "features"
        widget: "list"
        required: false
        field: { label: "Feature", name: "feature", widget: "string" }
      - label: "Timeline"
        name: "timeline"
        widget: "list"
        required: false
        hint: "Project phases and their progress"
        fields:
          - {
              label: "Phase",
              name: "phase",
              widget: "string",
              required: true,
              hint: "e.g., 'Foundation & Structure'",
            }
          - {
              label: "Duration",
              name: "duration",
              widget: "string",
              required: true,
              hint: "e.g., '2 months'",
            }
          - {
              label: "Status",
              name: "status",
              widget: "select",
              required: true,
              options: ["planned", "in-progress", "completed"],
            }
      - label: "Team"
        name: "team"
        widget: "object"
        required: false
        fields:
          - {
              label: "Project Manager",
              name: "projectManager",
              widget: "string",
              required: false,
            }
          - {
              label: "Architect",
              name: "architect",
              widget: "string",
              required: false,
            }
      - label: "Client"
        name: "client"
        widget: "object"
        required: false
        hint: "Client information and feedback"
        fields:
          - {
              label: "Name",
              name: "name",
              widget: "string",
              required: false,
              hint: "Client name or company",
            }
          - {
              label: "Testimonial",
              name: "testimonial",
              widget: "text",
              required: false,
              hint: "Client feedback or testimonial",
            }
          - {
              label: "Rating",
              name: "rating",
              widget: "number",
              min: 1,
              max: 5,
              required: false,
              hint: "Client satisfaction rating (1-5 stars)",
            }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
          hint: "Display this project prominently on the homepage",
        }
      - {
          label: "Body",
          name: "body",
          widget: "markdown",
          required: true,
          hint: "Detailed project description and content",
        }

